name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ruff
        run: pipx run ruff check .
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          ./plasma-sensors --version
          ./plasma-sensors --help > /dev/null
          ./plasma-sensors install --help > /dev/null
